<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="RCW IT Training Skill Passport — track levels, streaks, badges and your learning journey.">
<meta name="theme-color" content="#061633">
<title>Skill Passport | RCW IT Training</title>
<style>
  :root{--navy:#061633;--navy-2:#0a234a;--ink:#101b3b;--blue:#078be8;--blue-2:#0758c8;--cyan:#4bd7ff;
    --yellow:#ffd51d;--green:#9ee636;--paper:#f4f7fb;--white:#fff;--muted:#5f6c84;--line:#dce5f1;
    --shadow:0 10px 28px rgba(8,31,69,.10);--radius:18px}
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);background:linear-gradient(#fff,#f5f8fc 40%,#eef4fb);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5;min-height:100vh;padding:28px 18px 60px}
  .container{width:min(860px,100%);margin-inline:auto}
  .brand{font-size:14px;color:var(--muted);margin-bottom:18px}
  .brand a{color:var(--blue);text-decoration:none;font-weight:600}
  .brand a:hover{text-decoration:underline}
  h1{margin:0 0 6px;font-size:clamp(24px,4vw,32px);color:var(--navy);letter-spacing:-.5px}
  .sub{color:var(--muted);margin:0 0 26px;font-size:16px}
  .profile{display:flex;gap:20px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:20px;flex-wrap:wrap;box-shadow:var(--shadow)}
  .avatar{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue-2));display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#fff;flex-shrink:0}
  .pinfo{flex:1;min-width:200px}
  .nm{font-size:20px;font-weight:800;color:var(--navy);margin-bottom:2px}
  .lv{color:var(--blue);font-size:14px;font-weight:700;margin-bottom:8px}
  .xpbar{height:10px;background:var(--paper);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
  .xpbar .fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:999px}
  .xptxt{font-size:12px;color:var(--muted);margin-top:6px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;margin-bottom:20px}
  .stat{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px 18px;text-align:center;box-shadow:var(--shadow)}
  .stat .v{font-size:24px;font-weight:800;color:var(--blue)}
  .stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-top:4px}
  .sec{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:20px;box-shadow:var(--shadow)}
  .sec h2{margin:0 0 16px;font-size:18px;color:var(--navy)}
  .heat{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px}
  .col{display:flex;flex-direction:column;gap:4px}
  .cell{width:13px;height:13px;border-radius:3px;background:#e7edf5;flex-shrink:0}
  .cell.l1{background:#a8d3f5}.cell.l2{background:#4ba3f0}.cell.l3{background:#078be8}.cell.l4{background:#0758c8}
  .legend{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:11px;color:var(--muted)}
  .legend .cell{width:11px;height:11px}
  .badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .badge{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
  .badge .ic{font-size:30px;margin-bottom:8px}.badge .bn{font-size:13px;font-weight:700}.badge .bd{font-size:11px;color:var(--muted);line-height:1.4}
  .badge.locked{opacity:.4;filter:grayscale(1)}
  .cta{text-align:center;margin-top:28px}
  .cta a{display:inline-block;background:linear-gradient(135deg,var(--blue),var(--blue-2));color:#fff;text-decoration:none;font-weight:700;padding:14px 26px;border-radius:12px}
  .cta .sub{color:var(--muted);font-size:13px;margin-top:10px}
  .error{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:32px;text-align:center;color:var(--muted);box-shadow:var(--shadow)}
</style>
</head>
<body>
<div class="container">
  <div class="brand"><a href="https://www.rcwittraining.in">← RCW IT Training</a></div>
  <div id="app"></div>
</div>

<script src="passport.js"></script>
<script>
(function () {
  var BADGES = [
    { id: 'first', name: 'First Steps', ic: '🐣', desc: 'Complete your first lab' },
    { id: 'five', name: 'Lab Rat', ic: '🐀', desc: 'Complete 5 labs' },
    { id: 'quiz', name: 'Quiz Whiz', ic: '🧠', desc: 'Answer 100 questions' },
    { id: 'streak7', name: 'On Fire', ic: '🔥', desc: '7-day practice streak' },
    { id: 'streak14', name: 'Unstoppable', ic: '⚡', desc: '14-day practice streak' },
    { id: 'beat', name: 'Beat a Friend', ic: '🏆', desc: 'Win a head-to-head challenge' },
    { id: 'elite', name: 'Elite Scorer', ic: '💎', desc: 'Reach Top 10% in any lab' }
  ];

  var id = new URLSearchParams(location.search).get('id');
  var app = document.getElementById('app');

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function levelOf(xp) { return Math.floor(xp / 150) + 1; }

  function heatmapHTML(act) {
    var cols = 15, rows = 7, today = new Date(), html = '<div class="heat">';
    for (var c = cols - 1; c >= 0; c--) {
      html += '<div class="col">';
      for (var r = 0; r < rows; r++) {
        var daysBack = (cols - 1 - c) * 7 + (6 - r);
        var dt = new Date(today); dt.setDate(dt.getDate() - daysBack);
        var v = act[dt.toISOString().slice(0, 10)] || 0;
        var cls = v >= 5 ? 'l4' : v >= 3 ? 'l3' : v >= 2 ? 'l2' : v >= 1 ? 'l1' : '';
        html += '<div class="cell ' + cls + '"></div>';
      }
      html += '</div>';
    }
    return html + '</div>';
  }

  function badgesHTML(b) {
    var html = '';
    BADGES.forEach(function (bd) {
      var on = b && b[bd.id];
      html += '<div class="badge' + (on ? '' : ' locked') + '"><div class="ic">' + (on ? bd.ic : '🔒') + '</div>' +
        '<div class="bn">' + bd.name + '</div><div class="bd">' + bd.desc + '</div></div>';
    });
    return html;
  }

  function render(p) {
    var xp = p.xp || 0, lvl = levelOf(xp), base = (lvl - 1) * 150;
    var pct = Math.min(100, Math.round((xp - base) / 150 * 100));
    var badgeCount = 0; for (var k in (p.badges || {})) if (p.badges[k]) badgeCount++;
    var name = esc(p.name || 'Student');
    document.title = name + ' — Skill Passport | RCW IT Training';

    app.innerHTML =
      '<h1>' + name + '&#39;s Skill Passport</h1>' +
      '<p class="sub">Live proof of practice on RCW IT Training.</p>' +
      '<div class="profile">' +
        '<div class="avatar">' + esc((p.name || 'S').trim().charAt(0).toUpperCase()) + '</div>' +
        '<div class="pinfo">' +
          '<div class="nm">' + name + '</div>' +
          '<div class="lv">Level ' + lvl + '</div>' +
          '<div class="xpbar"><div class="fill" style="width:' + pct + '%"></div></div>' +
          '<div class="xptxt">' + xp + ' XP</div>' +
        '</div>' +
      '</div>' +
      '<div class="stats">' +
        '<div class="stat"><div class="v">' + (p.labs || 0) + '</div><div class="k">Labs done</div></div>' +
        '<div class="stat"><div class="v">' + (p.qs || 0) + '</div><div class="k">Questions</div></div>' +
        '<div class="stat"><div class="v">' + (p.streak || 0) + '</div><div class="k">Day streak</div></div>' +
        '<div class="stat"><div class="v">' + badgeCount + '</div><div class="k">Badges</div></div>' +
      '</div>' +
      '<div class="sec"><h2>🔥 Practice heatmap</h2>' + heatmapHTML(p.act || {}) +
        '<div class="legend">Less <span class="cell"></span><span class="cell l1"></span><span class="cell l2"></span><span class="cell l3"></span><span class="cell l4"></span> More</div></div>' +
      '<div class="sec"><h2>🏅 Badges</h2><div class="badges">' + badgesHTML(p.badges) + '</div></div>' +
      '<div class="cta"><a href="https://www.rcwittraining.in">Try it free — can you beat this?</a>' +
      '<div class="sub">Practice your way to a Skill Passport at RCW IT Training</div></div>';
  }

  function notFound(msg) {
    app.innerHTML = '<div class="error"><h2>Passport not found</h2><p>' + esc(msg || 'That link doesn&#39;t match any passport.') + '</p>' +
      '<p style="margin-top:16px"><a href="https://www.rcwittraining.in/skill-passport.html" style="color:var(--blue);font-weight:600">Create yours →</a></p></div>';
  }

  if (!id) { notFound('No passport id in the link.'); }
  else if (!RCWPassport.hasSupabase() && !RCWPassport.hasApi()) {
    notFound('The passport backend is not connected yet.');
  } else if (RCWPassport.hasSupabase()) {
    var url = RCWPassport.hasSupabase() && window.RCW_SUPABASE_URL
      ? window.RCW_SUPABASE_URL + '/rest/v1/passports?id=eq.' + encodeURIComponent(id) + '&select=data'
      : '';
    fetch(url, { headers: { apikey: window.RCW_SUPABASE_KEY, Authorization: 'Bearer ' + window.RCW_SUPABASE_KEY } })
      .then(function (r) { return r.json(); })
      .then(function (rows) {
        if (rows && rows.length && rows[0].data) render(rows[0].data); else notFound();
      })
      .catch(function () { notFound('Could not load that passport.'); });
  } else if (RCWPassport.hasApi()) {
    fetch(window.RCW_API_BASE + '/api/passport/' + encodeURIComponent(id))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (p) { if (p) render(p); else notFound(); })
      .catch(function () { notFound('Could not load that passport.'); });
  }
})();
</script>
</body>
</html>
