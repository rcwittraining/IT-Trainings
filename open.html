<!doctype html>
<html lang="en">
<head>
  <script src="rcw-consent.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#061633">
  <title>Opening simulator | RCW IT Training</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { color: #fff; background: #061633; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .bar { height: 58px; display: flex; align-items: center; gap: 14px; padding: 0 18px; border-bottom: 2px solid #078be8; background: linear-gradient(110deg, #041126, #082758); box-shadow: 0 5px 18px rgba(0,0,0,.18); }
    .brand { flex: 0 0 auto; display: grid; place-items: center; width: 38px; height: 38px; border: 1px solid #42c9ff; border-radius: 10px; color: #52d2ff; font-size: 11px; font-weight: 950; }
    .copy { min-width: 0; flex: 1; }
    .copy strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
    .copy span { display: block; color: #8faed1; font-size: 10px; font-weight: 750; letter-spacing: .5px; text-transform: uppercase; }
    .unofficial { position: fixed; left: 12px; bottom: 10px; z-index: 5; font-size: 10.5px; color: #8faed1; background: rgba(4,17,38,.85); border: 1px solid #163b66; padding: 5px 10px; border-radius: 999px; max-width: 90vw; }
    .back, .full { min-height: 34px; display: inline-flex; align-items: center; padding: 6px 11px; border: 1px solid #2b5a8b; border-radius: 9px; color: #c7e4ff; background: #09224a; text-decoration: none; font-size: 12px; font-weight: 800; cursor: pointer; }
    .back:hover, .full:hover { color: #fff; border-color: #4cbce9; }
    .full { font-family: inherit; }
    .stage { position: relative; width: 100%; height: calc(100% - 58px); background: #fff; }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
    .state { position: absolute; z-index: 2; inset: 0; display: grid; place-items: center; padding: 24px; color: #18304f; background: #f4f8fc; text-align: center; }
    .state[hidden] { display: none; }
    .panel { width: min(510px, 100%); padding: 30px; border: 1px solid #d8e3ef; border-radius: 18px; background: #fff; box-shadow: 0 15px 45px rgba(5, 31, 70, .12); }
    .spinner { width: 38px; height: 38px; margin: 0 auto 18px; border: 4px solid #d6eaf8; border-top-color: #078be8; border-radius: 50%; animation: spin .8s linear infinite; }
    .panel h1 { margin: 0 0 7px; font-size: 23px; }
    .panel p { margin: 0; color: #66758c; }
    .error-mark { width: 48px; height: 48px; display: grid; place-items: center; margin: 0 auto 16px; border-radius: 50%; color: #b22439; background: #fff0f2; font-size: 24px; font-weight: 900; }
    .home-link { display: inline-block; margin-top: 18px; padding: 9px 14px; border-radius: 9px; color: #fff; background: #076fc9; text-decoration: none; font-weight: 800; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 600px) {
      .bar { padding-inline: 9px; gap: 8px; }
      .brand { width: 34px; height: 34px; }
      .back { font-size: 0; }
      .back::after { content: "←"; font-size: 18px; }
      .full { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 1.8s; } }
  </style>
</head>
<body>
  <header class="bar">
    <span class="unofficial">Unofficial practice labs — not affiliated with any vendor.</span>
    <span class="brand">RCW</span>
    <div class="copy"><strong id="labTitle">Opening simulator…</strong><span>RCW IT Training secure launcher</span></div>
    <button class="full" id="fullscreenButton" type="button">Full screen</button>
    <a class="back" href="./" aria-label="Back to all labs">← All labs</a>
  </header>
  <main class="stage" id="stage">
    <div class="state" id="loadingState">
      <div class="panel"><div class="spinner"></div><h1>Opening your simulator</h1><p>Please wait while RCW IT Training prepares the lab.</p></div>
    </div>
    <div class="state" id="errorState" hidden>
      <div class="panel"><div class="error-mark">!</div><h1>Simulator unavailable</h1><p id="errorMessage">This simulator could not be opened.</p><a class="home-link" href="./">Return to all labs</a></div>
    </div>
    <iframe id="simulatorFrame" title="RCW IT Training simulator" allow="fullscreen; clipboard-read; clipboard-write" sandbox="allow-scripts allow-forms allow-modals allow-downloads allow-popups allow-same-origin" referrerpolicy="no-referrer" hidden></iframe>
  </main>
  <script>
    "use strict";
    const params = new URLSearchParams(location.search);
    const labId = params.get("lab");
    const frame = document.getElementById("simulatorFrame");
    const loading = document.getElementById("loadingState");
    const error = document.getElementById("errorState");

    function showError(message) {
      loading.hidden = true;
      frame.hidden = true;
      error.hidden = false;
      document.getElementById("errorMessage").textContent = message;
      document.title = "Simulator unavailable | RCW IT Training";
    }

    async function openSimulator() {
      if (!labId) return showError("No simulator was selected.");
      try {
        const response = await fetch(`./simulators.json?v=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error("The simulator list could not be loaded.");
        const payload = await response.json();
        const simulators = Array.isArray(payload) ? payload : payload.simulators;
        const lab = Array.isArray(simulators) ? simulators.find(item => item.id === labId) : null;
        if (!lab) throw new Error("The requested simulator was not found.");

        const target = new URL(lab.targetUrl);
        const approvedHosts = new Set([
          "rcwittraining.github.io",
          "www.rcwittraining.in",
          "rcwittraining.in"
        ]);
        if (target.protocol !== "https:" || !approvedHosts.has(target.hostname)) {
          throw new Error("The simulator destination is not approved.");
        }

        document.getElementById("labTitle").textContent = lab.title;
        document.title = `${lab.title} | RCW IT Training`;
        frame.title = lab.title;
        frame.addEventListener("load", () => {
          loading.hidden = true;
          frame.hidden = false;
        }, { once: true });
        frame.src = target.href;
      } catch (problem) {
        showError(problem.message || "This simulator could not be opened.");
      }
    }

    document.getElementById("fullscreenButton").addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) await document.getElementById("stage").requestFullscreen();
        else await document.exitFullscreen();
      } catch (_) {}
    });

    openSimulator();
  </script>
</body>
</html>
