name: Build RCW AI Log Analyzer Windows EXE
on:
  push:
    paths:
      - 'rcw-ai-log-analyzer-desktop/app.py'
      - '.github/workflows/build-rcw-log-analyzer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build portable executable
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name RCW-AI-Log-Analyzer rcw-ai-log-analyzer-desktop/app.py
      - uses: actions/upload-artifact@v4
        with:
          name: RCW-AI-Log-Analyzer-Windows-EXE
          path: dist/RCW-AI-Log-Analyzer.exe
          if-no-files-found: error
