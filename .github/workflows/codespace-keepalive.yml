name: Codespace Keep-Alive (Never Expiry) - On-Demand

# Optimal: Keeps codespaces NEVER deleted, but NEVER running
# - Codespaces stay in Shutdown (retained, no compute billing, only storage)
# - Only runs when YOU or a user clicks "Launch" on your website -> then GitHub starts it
# - This workflow just refreshes retention every 20 days via API patch (0 = Never), no start/stop
on:
  schedule:
    - cron: '15 2 */20 * *'  # every 20 days at 02:15 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Refresh retention to Never (zero compute)
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_KEEPER_PAT }}
        run: |
          echo "🔄 Refreshing retention to Never (0) for all codespaces — zero compute, no running"
          CS_JSON=$(curl -s -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/user/codespaces || echo '{"codespaces":[]}')
          COUNT=$(echo "$CS_JSON" | jq -r '.total_count // 0')
          echo "Found $COUNT codespaces (all will stay Shutdown, not running)"

          if [ "$COUNT" = "0" ]; then
            echo "No codespaces — nothing to do."
            exit 0
          fi

          echo "$CS_JSON" | jq -c '.codespaces[]' | while read -r cs; do
            name=$(echo "$cs" | jq -r '.name')
            state=$(echo "$cs" | jq -r '.state')
            expires=$(echo "$cs" | jq -r '.retention_expires_at // "None (Never)"')
            echo "---"
            echo "Codespace: $name"
            echo "  State: $state (will keep as Shutdown — NOT started)"
            echo "  Expires before: $expires"
            # Lightweight PATCH only — no start/stop, so 0 core-hours billed
            RES=$(curl -s -X PATCH -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" -d '{"retention_period_minutes":0}' "https://api.github.com/user/codespaces/$name")
            RET=$(echo "$RES" | jq -r '.retention_period_minutes')
            EXP=$(echo "$RES" | jq -r '.retention_expires_at // "None (Never)"')
            echo "  → Patched retention: $RET (0=Never) expires: $EXP"
            if [ "$RET" = "0" ]; then
              echo "  ✅ Now Never-Expiry, still Shutdown (no billing)"
            else
              echo "  ⚠️ Patch returned $RET — will retry next run"
            fi
          done

          echo ""
          echo "✅ Done. All codespaces remain Shutdown (not running) but Never-Deleted."
          echo "They will ONLY run when you/your user clicks Launch on the website or at github.com/codespaces."

      - name: Summary
        run: |
          echo "### ✅ Keep-Alive (On-Demand) Complete" >> $GITHUB_STEP_SUMMARY
          echo "All codespaces kept as **Shutdown** (no compute cost) but **Never-Expiry** (retention=0)." >> $GITHUB_STEP_SUMMARY
          echo "They start **only when a user launches from your website**." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Cost this run: ~0 min Actions (public repo = free) + 0 core-hours Codespaces (no start)" >> $GITHUB_STEP_SUMMARY
          echo "- Storage only: ~\$0.07/GB-month beyond 15GB free (Shutdown still counts storage)" >> $GITHUB_STEP_SUMMARY
