name: Build RCW-NixTrace (Windows exe)

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/rcw-nixtrace/src/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: tools/rcw-nixtrace
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.22.2 paramiko python-docx

      - name: Build executable
        working-directory: tools/rcw-nixtrace
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name RCW-NixTrace `
            --icon src/rcw.ico `
            --version-file src/version.txt `
            --hidden-import paramiko `
            --collect-submodules paramiko `
            --exclude-module numpy --exclude-module matplotlib --exclude-module PIL `
            --distpath dist --workpath build `
            src/rcw_nixtrace.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: RCW-NixTrace-exe
          path: tools/rcw-nixtrace/dist/RCW-NixTrace.exe
