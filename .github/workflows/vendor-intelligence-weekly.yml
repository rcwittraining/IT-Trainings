name: Publish weekly vendor technology intelligence
on:
  schedule:
    # Daily at 09:15 IST (03:45 UTC)
    - cron: '45 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-articles
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Collect and publish weekly technology, certification and webinar roundup
        run: python scripts/publish_vendor_intelligence.py
      - name: Commit website update
        run: |
          git config user.name 'RCW Vendor Intelligence Publisher'
          git config user.email 'actions@github.com'
          git add index.html data/vendor-intelligence-state.json vendor-tech-certification-webinar-roundup-*.html
          if git diff --cached --quiet; then echo 'No new vendor items to publish.'; exit 0; fi
          git commit -m 'Publish weekly vendor technology roundup'
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected (remote moved); rebasing and retrying (attempt $attempt)..."
            git pull --rebase origin main
          done
          git push
