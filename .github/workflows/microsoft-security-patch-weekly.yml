name: Publish weekly Microsoft security patch roundup
on:
  schedule:
    # Daily at 09:00 India Standard Time (03:30 UTC)
    - cron: '30 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-articles
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build weekly article from official MSRC feed
        run: python scripts/publish_microsoft_patch_digest.py
      - name: Commit and publish when there is new advisory content
        run: |
          git config user.name 'RCW Patch Publisher'
          git config user.email 'actions@github.com'
          git add index.html data/ microsoft-security-patch-roundup-*.html
          if git diff --cached --quiet; then
            echo 'No new Microsoft security updates to publish.'
            exit 0
          fi
          git commit -m 'Publish weekly Microsoft security patch roundup'
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected (remote moved); rebasing and retrying (attempt $attempt)..."
            git pull --rebase origin main
          done
          git push
